name: Security scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Default minimal permissions — each job overrides only what it actually needs.
permissions: read-all

# Cancel in-progress runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Overview of checks:
#
#  powershell-lint  → PSScriptAnalyzer SARIF (all .ps1/.psm1 in src/)
#  devskim          → DevSkim (insecure code patterns in PowerShell)
#  semgrep          → Semgrep (OWASP Top 10, secrets detection)
#  actionlint       → actionlint (validates GitHub Actions workflow YAML)
# ============================================================

jobs:

  # ----------------------------------------------------------
  # POWERSHELL LINT (SARIF)
  # Runs PSScriptAnalyzer on all PowerShell scripts and uploads
  # findings to the GitHub Security tab.
  # Settings: .github/linters/PSScriptAnalyzerSettings.psd1
  # ----------------------------------------------------------
  powershell-lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $settings = '.github/linters/PSScriptAnalyzerSettings.psd1'
          $results = Get-ChildItem -Path 'src' -Recurse -Include '*.ps1', '*.psm1' |
              Invoke-ScriptAnalyzer -Settings $settings

          $repoRoot = (Get-Location).Path.Replace('\', '/')
          $sarifResults = foreach ($r in $results) {
              $uri = $r.ScriptPath.Replace('\', '/') -replace "^$([regex]::Escape($repoRoot))/", ''
              @{
                  ruleId    = $r.RuleName
                  level     = switch ($r.Severity) { 'Error' { 'error' } 'Warning' { 'warning' } default { 'note' } }
                  message   = @{ text = $r.Message }
                  locations = @(@{
                      physicalLocation = @{
                          artifactLocation = @{ uri = $uri; uriBaseId = '%SRCROOT%' }
                          region           = @{ startLine = $r.Line; startColumn = $r.Column }
                      }
                  })
              }
          }

          $sarif = @{
              '$schema' = 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json'
              version   = '2.1.0'
              runs      = @(@{
                  tool    = @{ driver = @{ name = 'PSScriptAnalyzer'; version = '1.25.0'; informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'; rules = @() } }
                  results = @($sarifResults)
              })
          }
          $sarif | ConvertTo-Json -Depth 20 -Compress | Set-Content 'psscriptanalyzer-results.sarif' -Encoding utf8

          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize
              Write-Host "::warning::PSScriptAnalyzer found $($results.Count) issue(s) — see Security tab for details."
          } else {
              Write-Host "No issues found."
          }

      - name: Upload PSScriptAnalyzer results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: psscriptanalyzer-results.sarif
          category: psscriptanalyzer

  # ----------------------------------------------------------
  # DEVSKIM SECURITY LINT
  # Catches insecure patterns in PowerShell: deprecated crypto,
  # injection risks, unsafe APIs.
  # ----------------------------------------------------------
  devskim:
    name: Security lint (DevSkim)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16

      - name: Upload DevSkim results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: devskim-results.sarif
          category: devskim

  # ----------------------------------------------------------
  # SEMGREP
  # Detects hardcoded secrets and OWASP Top 10 patterns.
  # Never blocks CI — findings go to Security tab only.
  # ----------------------------------------------------------
  semgrep:
    name: Semgrep (OWASP / secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config auto \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            src/ || true

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ----------------------------------------------------------
  # ACTIONLINT
  # Validates all GitHub Actions workflow YAML files.
  # Fails CI so broken workflows are caught before merge.
  # ----------------------------------------------------------
  actionlint:
    name: GitHub Actions lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
