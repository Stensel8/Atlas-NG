---
title: Reverts changes
description: Reverts changes from past versions
privilege: TrustedInstaller
onUpgrade: true
actions:
  - !writeStatus: { status: "Reverting old changes" }
  - !powerShell:
    # -PromptOnFailure mirrors upstream's isSetScheduledTaskOnCrash: a silent repair
    # has no desktop to report to, so a failure schedules a retry offer at next logon.
    command: '& (Join-Path $env:windir "AtlasDesktop\9. Troubleshooting\Fix-Store.ps1") -Silent -PromptOnFailure'
    weight: 2
    wait: true
    onUpgrade: true
