---
title: Initial Configuration
description: Performs the preliminary configuration
actions:
  - !writeStatus: {status: 'Setting the environment'}
  - !powerShell:
    wait: true
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tasks\Initialize-AtlasPath.ps1'')'

  ################ NO LOCAL BUILD ################

  # writeStatus strings are truncated by AME Wizard at ~28 characters — keep them short
  - !writeStatus: {status: 'Disabling legacy features'}
  # VBScript is a capability on 26200+ (not an optional feature) — use Remove-Capability
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"VBSCRIPT~~~~" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:MediaPlayback /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:WindowsMediaPlayer /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Media.WindowsMediaPlayer~~~~0.0.12.0" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:WorkFolders-Client /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:MicrosoftWindowsPowerShellISE /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Microsoft.Windows.PowerShell.ISE~~~~0.0.1.0" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Microsoft.Windows.Notepad.System~~~~0.0.1.0" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Browser.InternetExplorer~~~~0.0.11.0" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Microsoft.Wallpapers.Extended~~~~0.0.1.0" /NoRestart', weight: 30, ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"MathRecognizer~~~~0.0.1.0" /NoRestart', weight: 30, ignoreErrors: true}

  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"App.StepsRecorder~~~~0.0.1.0" /NoRestart', weight: 30, onUpgrade: false}

  - !writeStatus: {status: 'Cleaning the component store'}
  - !run: {exe: 'DISM.exe', args: '/Online /Cleanup-Image /StartComponentCleanup', weight: 50, ignoreErrors: true}

    # Initial software — VC++ Runtimes, NanaZip
  - !writeStatus: {status: 'Installing utilities'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1'
    exeDir: true
    wait: true
    onUpgrade: false
    weight: 150
    runas: currentUserElevated

    # Legacy gaming SDKs (optional)
  - !writeStatus: {status: 'Installing legacy DirectX', option: 'legacy-directx'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -DirectX'
    exeDir: true
    wait: true
    weight: 120
    option: 'legacy-directx'
    runas: currentUserElevated
  - !writeStatus: {status: 'Enabling DirectPlay', option: 'legacy-directplay'}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:LegacyComponents /NoRestart', weight: 30, option: 'legacy-directplay', ignoreErrors: true}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:DirectPlay /NoRestart', weight: 30, option: 'legacy-directplay', ignoreErrors: true}

    # Toolbox
  - !writeStatus: {status: 'Installing AtlasOS Toolbox', option: 'install-toolbox'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -Toolbox'
    exeDir: true
    wait: true
    weight: 100
    option: 'install-toolbox'
    runas: currentUserElevated

    # eclean
  - !writeStatus: {status: 'Installing eclean', option: 'install-eclean'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -Eclean'
    exeDir: true
    wait: true
    weight: 100
    option: 'install-eclean'
    runas: currentUserElevated

    # UniGetUI
  - !writeStatus: {status: 'Installing UniGetUI', option: 'install-unigetui'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -UniGetUI'
    exeDir: true
    wait: true
    weight: 100
    option: 'install-unigetui'
    runas: currentUserElevated

    # Browsers
  - !writeStatus: {status: 'Installing Brave', option: 'browser-brave'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -Brave'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-brave'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -Firefox'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-firefox'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing LibreWolf', option: 'browser-librewolf'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -LibreWolf'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-librewolf'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Google Chrome', option: 'browser-chrome'}
  - !powerShell:
    command: '.\Install-AtlasSoftware.ps1 -Chrome'
    exeDir: true
    wait: true
    weight: 120
    option: 'browser-chrome'
    runas: currentUserElevated

  ################ END NO LOCAL BUILD ################
